<title>Spionosaurus – Spionos rasante Raser-Rallye</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#08120d; color:#eef7f0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;

  .wrap{
    width:min(96vw,980px); padding:18px; border:1px solid #315c45;

  }
  h1{
    margin:0; font-size:clamp(24px,3.15vw,36px); line-height:1;
    text-align:center; white-space:nowrap; min-height:58px; display:flex; align-items:center; justify-content:center;
  }
  .title-line{
    display:grid;grid-template-columns:66px minmax(0,1fr) 66px;align-items:center;gap:10px;
    margin:0 0 14px;width:100%;

  .title-head{width:66px;height:66px;object-fit:contain;display:block}

<script>

let last=performance.now();
let state;

const TREE_DRAW_SIZE=118,ROCK_DRAW_SIZE=82;
const CLOUD_DRAW_SIZES=[104,124,146];
const CLOUD_HITBOXES=[{w:76,h:58},{w:92,h:70},{w:108,h:82}];
const BIRD_DRAW_SIZES=[74,84,96];
const BIRD_HITBOXES=[{w:54,h:30},{w:62,h:34},{w:74,h:40}];
const BUOY_DRAW_SIZES=[98,82,92];
const BUOY_HITBOXES=[{w:61,h:76},{w:50,h:62},{w:56,h:70}];
const SFX_VOLUME_MULTIPLIER=1.4;
const TREE_HITBOXES=[{w:108,h:50},{w:110,h:46},{w:104,h:56}];
const ROCK_HITBOXES=[{w:62,h:58},{w:74,h:44},{w:58,h:70}];
const SPAWN_PAD_FUEL_OBSTACLE=18;
const SPAWN_PAD_CREEK_OBSTACLE=28;
const SPAWN_PAD_FUEL_CREEK=12;
const RIVER_FALLBACK_H=298;
const BRIDGE_HEIGHT_FACTOR=1.08;
const LOW_FUEL_RATIO=.20;
const NEAR_MISS_DIST=14;
const DUST_PATCH_CONTROL=.68;
const CROCODILE_W=138,CROCODILE_H=82,CROCODILE_HIT_W=118,CROCODILE_HIT_H=44;
const CROCODILE_BANK_X=125;
const RIVER_LEADING_COLLISION_INSET=34;
const KITE_W=110.4,KITE_H=129.6,KITE_HIT_W=74.4,KITE_HIT_H=103.2;
const WILDBOAR_W=104,WILDBOAR_H=64,WILDBOAR_HIT_W=84,WILDBOAR_HIT_H=42;
const WILDBOAR_LANES=[160,235,310,385,460];

function spriteReady(img){return img&&img.complete&&img.naturalWidth>0;}
function fitByHeight(img,targetH,fallbackW=targetH){
  if(!spriteReady(img))return{w:fallbackW,h:targetH};
  return{w:targetH*(img.naturalWidth/img.naturalHeight),h:targetH};
}
function fuelDrawSize(){
  const img=SPRITES.fuels[state.levelIndex]||SPRITES.fuels[0];
  const scale=state.levelIndex===2?1.5:1;
  return fitByHeight(img,FUEL_H*scale,FUEL_W*scale);
}
function medipacDrawSize(){
  const img=SPRITES.medkits[state.levelIndex]||SPRITES.medkits[0];
  const scale=state.levelIndex===2?1.5:1;
  return fitByHeight(img,MEDIPAC_H*scale,MEDIPAC_W*scale);
}
function riverDrawH(){
  const img=SPRITES.river;
  return (spriteReady(img)?W*(img.naturalHeight/img.naturalWidth):RIVER_FALLBACK_H)*0.60;
}
function bridgeDrawSize(){
  const h=riverDrawH()*BRIDGE_HEIGHT_FACTOR;
  const img=SPRITES.bridge;
  const ratio=spriteReady(img)?img.naturalWidth/img.naturalHeight:1.095;
  return {w:h*ratio,h};
}

let audioCtx=null,soundMuted=false;
function ensureAudio(){
  if(soundMuted)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;
}
function tone(freq,duration=.09,type='sine',volume=.035,delay=0){
  const ac=ensureAudio();if(!ac)return;const t=ac.currentTime+delay,osc=ac.createOscillator(),gain=ac.createGain();
  volume*=SFX_VOLUME_MULTIPLIER;
  osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+duration+.03);
}
function sfx(name){
  if(soundMuted)return;
  if(name==='count')tone(500,.07,'square',.025);
  else if(name==='start'){tone(440,.07,'triangle',.03);tone(660,.10,'triangle',.035,.08)}
  else if(name==='hit'){tone(150,.12,'sawtooth',.045);tone(95,.18,'square',.035,.05)}
  else if(name==='fuel'){tone(620,.07,'triangle',.03);tone(840,.10,'triangle',.035,.07)}
  else if(name==='medipac'){tone(520,.07,'sine',.03);tone(700,.08,'sine',.035,.06);tone(920,.11,'triangle',.03,.13)}
  else if(name==='jump'){tone(280,.07,'triangle',.03);tone(430,.09,'triangle',.035,.045);tone(620,.08,'sine',.025,.11)}
  else if(name==='level'){tone(520,.08,'triangle',.03);tone(700,.09,'triangle',.035,.08);tone(900,.12,'triangle',.04,.17)}
  else if(name==='fail'){tone(180,.14,'square',.04);tone(120,.20,'sawtooth',.035,.10)}
  else if(name==='win'){tone(440,.08,'triangle',.03);tone(660,.10,'triangle',.035,.09);tone(880,.15,'triangle',.04,.19)}
}

function makeFuelSchedule(){
  return Array.from({length:FUEL_ITEMS_TOTAL},(_,i)=>{
    const arrival=7.5+i*5+(Math.random()*1.5-.75);
    return {spawnAt:Math.max(.8,arrival-FUEL_TRAVEL_LEAD),spawned:false};
  });
}
function makeCreekSchedule(){
  return LEVELS[state.levelIndex].creekArrivals.map(arrival=>({spawnAt:Math.max(.5,arrival-FUEL_TRAVEL_LEAD),spawned:false}));
}
function makeMedipacSchedule(){
  // Genau ein Medipac pro Level; Ankunft zwischen 50 % und knapp vor 80 % des Levels.
  const arrival=LEVEL_SECONDS*(.50+Math.random()*.28);
  return {spawnAt:Math.max(.8,arrival-FUEL_TRAVEL_LEAD),spawned:false};
}
function makeDustPatches(){
  return [
    {x:236,w:350,h:106,y:-300,phase:0.4},
    {x:304,w:332,h:100,y:-1510,phase:1.8},
    {x:214,w:372,h:110,y:-2720,phase:2.9},
    {x:286,w:340,h:102,y:-3910,phase:4.1}
  ];
}
function makeWindGusts(){
  const gusts=[];
  let t=5.8+Math.random()*1.6;
  for(let i=0;i<5;i++){
    const dur=1.9+Math.random()*1.0;
    const force=(Math.random()<.5?-1:1)*(82+Math.random()*38);
    gusts.push({start:t,dur,force});
    t+=6.2+Math.random()*2.5;
  }
  return gusts;
}
function makeCrossingSchedule(count,start=6,end=48){
  const arr=[];
  const span=(end-start)/count;
  for(let i=0;i<count;i++){
    const center=start+span*(i+.5);
    const jitter=span*.26;
    arr.push({spawnAt:Math.max(1.2,center+(Math.random()*2-1)*jitter),spawned:false});
  }
  return arr;
}
function vehicleCfg(){return VEHICLES[LEVELS[state.levelIndex].vehicle];}
function levelCfg(){return LEVELS[state.levelIndex];}
function progress01(){return Math.min(1,state.elapsed/LEVEL_SECONDS);}
function lerp(a,b,t){return a+(b-a)*t;}

function initLevel(levelIndex,mode='start'){
  const keepLevel=Math.max(0,Math.min(2,levelIndex));
  state={
    levelIndex:keepLevel,mode,countdown:3,countdownUntil:0,
    elapsed:0,roadOffset:0,jeepX:W/2,jeepY:H-120,jeepTilt:0,
    jumping:false,jumpElapsed:0,sideEdgeContact:false,steerX:0,
    hits:0,invuln:0,obstacles:[],fuelItems:[],medipacItems:[],creeks:[],fuel:FUEL_MAX,fuelCollected:0,
    crocodiles:[],kites:[],wildboars:[],crocSchedule:[],kiteSchedule:[],wildboarSchedule:[],
    fuelSchedule:[],medipacSchedule:null,creekSchedule:[],spawnDistance:120,distanceTravelled:0,shake:0,flash:0,
    dustPatches:[],windGusts:[],windForce:0,
    stego:null,stegoSpawned:false,stegoMessageUntil:0,
    triceratops:null,triceratopsSpawned:false,triceratopsMessageUntil:0,
    nearMissUntil:0,nearMissCooldown:0,
    exitSpeed:0,exitFinal:false
  };
  state.fuelSchedule=makeFuelSchedule();
  state.medipacSchedule=makeMedipacSchedule();
  state.creekSchedule=makeCreekSchedule();
  if(keepLevel===0){
    state.wildboarSchedule=[
      {spawnAt:8.5,spawned:false,fromLeft:true,y:210},
      {spawnAt:24.0,spawned:false,fromLeft:false,y:330},
      {spawnAt:39.0,spawned:false,fromLeft:true,y:455}
    ];
  }
  if(keepLevel===1){
    state.crocSchedule=makeCrossingSchedule(5,6,43);
    // Von den fünf Krokodilen queren zwei bewusst im unteren Bildbereich.
    const lowerSlots=[1,3];
    state.crocSchedule.forEach((c,i)=>c.lowerCrossing=lowerSlots.includes(i));
  }
  if(keepLevel===2){state.windGusts=makeWindGusts();state.kiteSchedule=makeCrossingSchedule(5,8,50);}
  keys.left=keys.right=keys.up=keys.down=false;
  updateHud();
}
function reset(){initLevel(0,'start');}
reset();

function updateHud(){
  hitState.textContent=`${state.hits}/${MAX_HITS}`;
  const ratio=Math.max(0,Math.min(1,state.fuel/FUEL_MAX));
  fuelFill.style.transform=`scaleX(${ratio})`;
  if(ratio<=LOW_FUEL_RATIO&&state&&state.mode==='play'){
    const pulse=.62+.38*(.5+.5*Math.sin(performance.now()*0.018));
    fuelFill.style.opacity=String(pulse);
    fuelFill.style.filter=`brightness(${1.0+.45*pulse}) saturate(1.25)`;
    fuelFill.style.boxShadow=`0 0 ${8+10*pulse}px rgba(255,210,70,.75)`;
  }else{
    fuelFill.style.opacity='1';
    fuelFill.style.filter='';
    fuelFill.style.boxShadow='';
  }
}
function startCountdown(){
  if(['start','win','fail','fuelFail'].includes(state.mode)){
    if(['win','fail','fuelFail'].includes(state.mode)) reset();
    ensureAudio();state.mode='countdown';state.countdown=3;state.countdownUntil=performance.now()+650;sfx('count');
  }
}
function startInterLevelCountdown(levelIndex){
  initLevel(levelIndex,'countdown');
  ensureAudio();
  state.countdown=3;
  state.countdownUntil=performance.now()+650;
  sfx('count');
}
function beginLevelExit(){
  state.mode='levelExit';
  state.exitSpeed=760;
  state.exitFinal=state.levelIndex>=2;
  state.jumping=false;
  state.jumpElapsed=0;
  keys.left=keys.right=keys.up=keys.down=false;
}

function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function paddedRect(r,p){return{x:r.x-p,y:r.y-p,w:r.w+p*2,h:r.h+p*2};}
function obstacleRect(o){return{x:o.x-o.hitW/2,y:(o.y+(o.floatY||0))-o.hitH/2,w:o.hitW,h:o.hitH};}
function crocodileRect(c){return{x:c.x-CROCODILE_HIT_W/2,y:c.y-CROCODILE_HIT_H/2,w:CROCODILE_HIT_W,h:CROCODILE_HIT_H};}
function kiteRect(k){return{x:k.x-KITE_HIT_W/2,y:k.y-KITE_HIT_H/2,w:KITE_HIT_W,h:KITE_HIT_H};}
function wildboarRect(b){return{x:b.x-WILDBOAR_HIT_W/2,y:b.y-WILDBOAR_HIT_H/2,w:WILDBOAR_HIT_W,h:WILDBOAR_HIT_H};}
function fuelRect(f){const s=fuelDrawSize();return{x:f.x-s.w*.40,y:f.y-s.h*.42,w:s.w*.80,h:s.h*.84};}
function medipacRect(m){const s=medipacDrawSize();return{x:m.x-s.w*.42,y:m.y-s.h*.42,w:s.w*.84,h:s.h*.84};}
function creekRect(c){const h=riverDrawH();return{x:0,y:c.y-h/2,w:W,h};}
function creekWaterHitRects(c){
  const riverH=riverDrawH(),bridge=bridgeDrawSize(),waterY=c.y-riverH/2;
  // Die zuerst heranlaufende (untere) Wasserkante reagiert etwas später als die sichtbare Grafik.
  const hitH=Math.max(1,riverH-RIVER_LEADING_COLLISION_INSET);
  const left={x:0,y:waterY,w:Math.max(0,c.bridgeX-bridge.w/2),h:hitH};
  const rightX=c.bridgeX+bridge.w/2;
  const right={x:rightX,y:waterY,w:Math.max(0,W-rightX),h:hitH};
  return [left,right];
}
function overlapsAny(rect,items,rectFn,pad=0){return items.some(item=>rectHit(paddedRect(rect,pad),rectFn(item)));}
function distanceBetweenRects(a,b){
  const dx=Math.max(0,Math.max(a.x-(b.x+b.w),b.x-(a.x+a.w)));
  const dy=Math.max(0,Math.max(a.y-(b.y+b.h),b.y-(a.y+a.h)));
  return Math.hypot(dx,dy);
}
function nearestDistance(rect,items,rectFn){let best=Infinity;for(const item of items)best=Math.min(best,distanceBetweenRects(rect,rectFn(item)));return best;}

function randomObstacleSpec(){
  if(state.levelIndex===2){
    const type=Math.random()<.58?'cloud':'bird';
    const variant=Math.floor(Math.random()*3);
    if(type==='cloud')return{type,variant,hit:CLOUD_HITBOXES[variant],drawSize:CLOUD_DRAW_SIZES[variant]};
    return{type,variant,hit:BIRD_HITBOXES[variant],drawSize:BIRD_DRAW_SIZES[variant]};
  }
  if(state.levelIndex===1){
    const pool=[
      {type:'tree',variant:1,hit:TREE_HITBOXES[1],drawSize:TREE_DRAW_SIZE},

function update(dt,now){

    // Die komplette Szene bleibt stehen. Nur Spiono schießt aus dem Bild.

  }

  const dirX=(keys.left?-1:0)+(keys.right?1:0),dirY=(keys.up?-1:0)+(keys.down?1:0);
  const lag=cfg.steerLag||0;

  if(state.invuln>0)state.invuln=Math.max(0,state.invuln-dt);if(state.flash>0)state.flash=Math.max(0,state.flash-dt);if(state.shake>0)state.shake=Math.max(0,state.shake-dt);if(state.nearMissCooldown>0)state.nearMissCooldown=Math.max(0,state.nearMissCooldown-dt);

  const player={x:state.jeepX-v.hitW*.5,y:state.jeepY-v.hitH*.5,w:v.hitW,h:v.hitH};
  for(const f of state.fuelItems){if(rectHit(player,fuelRect(f))){state.fuel=Math.min(FUEL_MAX,state.fuel+FUEL_PER_ITEM);state.fuelCollected++;f.y=H+200;sfx('fuel');}}
  for(const m of state.medipacItems){
    if(rectHit(player,medipacRect(m))){
      if(state.hits>0)state.hits--;
      m.y=H+200;
      sfx('medipac');
      updateHud();
    }
  }

  if(state.levelIndex===0&&state.invuln<=0&&!state.jumping){
    for(const c of state.creeks){
      if(c.hit)continue;
      const [left,right]=creekWaterHitRects(c);
      if(rectHit(player,left)||rectHit(player,right)){c.hit=true;hitPlayer();break;}
    }
  }
  if(state.invuln<=0&&!state.jumping){
    for(const o of state.obstacles){if(rectHit(player,obstacleRect(o))){o.y=H+200;hitPlayer();break;}}
    if(state.invuln<=0){for(const b of state.wildboars){if(rectHit(player,wildboarRect(b))){b.x=b.fromLeft?W+999:-999;hitPlayer();break;}}}
    if(state.invuln<=0){for(const c of state.crocodiles){if(!c.hit&&rectHit(player,crocodileRect(c))){c.hit=true;hitPlayer();break;}}}
    if(state.invuln<=0){for(const k of state.kites){if(rectHit(player,kiteRect(k))){k.y=-999;hitPlayer();break;}}}
  }
  if(state.mode==='play'&&state.invuln<=0&&state.nearMissCooldown<=0&&!state.jumping){
    let near=Math.min(nearestDistance(player,state.obstacles,obstacleRect),nearestDistance(player,state.wildboars,wildboarRect),nearestDistance(player,state.crocodiles,crocodileRect),nearestDistance(player,state.kites,kiteRect));
    if(state.levelIndex===0&&!state.jumping){
      for(const c of state.creeks){
        const [left,right]=creekWaterHitRects(c);
        near=Math.min(near,distanceBetweenRects(player,left),distanceBetweenRects(player,right));
      }
    }
    if(near>0&&near<NEAR_MISS_DIST){state.nearMissUntil=now+230;state.nearMissCooldown=.45;}
  }
  updateHud();
}

  ctx.save();
  ctx.globalAlpha=.96;
  if(spriteReady(SPRITES.stego))ctx.drawImage(SPRITES.stego,s.x-s.w/2,s.y-s.h/2,s.w,s.h);
  ctx.restore();
}
function drawStegoMessage(now){
  if(state.levelIndex!==0||state.mode!=='play'||now>=state.stegoMessageUntil)return;
  const boxW=610,boxH=36;
  ctx.fillStyle='rgba(0,0,0,.62)';
  ctx.fillRect(W/2-boxW/2,35,boxW,boxH);
  ctx.fillStyle='#ffe59a';
  ctx.font='bold 16px system-ui';
  ctx.textAlign='center';
  ctx.fillText('🦕 Gib Gummi, Spiono, Bleifuß und Vollgas!',W/2,59);
  ctx.textAlign='left';
}
function drawTriceratops(){
  if(!state.triceratops||state.levelIndex!==1)return;
  const s=state.triceratops;
  ctx.save();
  ctx.globalAlpha=.96;
  if(spriteReady(SPRITES.triceratops))ctx.drawImage(SPRITES.triceratops,s.x-s.w/2,s.y-s.h/2,s.w,s.h);
  ctx.restore();
}
function drawTriceratopsMessage(now){
  if(state.levelIndex!==1||state.mode!=='play'||now>=state.triceratopsMessageUntil)return;
  const boxW=610,boxH=36;
  ctx.fillStyle='rgba(0,0,0,.62)';
  ctx.fillRect(W/2-boxW/2,35,boxW,boxH);
  ctx.fillStyle='#ffe59a';
  ctx.font='bold 16px system-ui';
  ctx.textAlign='center';
  ctx.fillText('🦏 Bist du etwa wasserscheu, Spiono? Reiß den Hahn auf!',W/2,59);
  ctx.textAlign='left';
}
function drawVehicle(now){
  const blink=state.invuln>0&&Math.floor(now/90)%2===0;if(blink)return;
  const cfg=vehicleCfg(),key=levelCfg().vehicle,img=SPRITES[key];
  const jp=state.jumping?Math.min(1,state.jumpElapsed/JUMP_DURATION):0,arc=state.jumping?Math.sin(jp*Math.PI):0,lift=arc*JUMP_HEIGHT;
  const groundFactor=1-arc,terrainX=(Math.sin(now*.027)*.45+Math.sin(now*.061)*.20)*groundFactor,terrainY=(Math.sin(now*.019)*1.10+Math.sin(now*.047)*.50)*groundFactor,terrainRot=(Math.sin(now*.013)*.007+Math.sin(now*.037)*.003)*groundFactor;
  if(key!=='jet'){
    const shadowScale=key==='jeep'?1.20:1;
    ctx.save();ctx.translate(state.jeepX,state.jeepY);ctx.fillStyle=`rgba(0,0,0,${.23-.10*arc})`;ctx.beginPath();ctx.ellipse(0,12,cfg.hitW*.60*shadowScale,cfg.hitH*.48*shadowScale,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if(key==='jeep')drawJeepDirt(now,cfg,arc,terrainX,terrainY,terrainRot,lift);
  else if(key==='jetski')drawJetskiSplash(now,cfg,arc,terrainX,terrainY,terrainRot,lift);
  ctx.save();ctx.translate(state.jeepX+terrainX,state.jeepY-lift+terrainY);ctx.rotate(state.jeepTilt+terrainRot);const scale=1+.045*arc;ctx.scale(scale,scale);
  if(spriteReady(img))ctx.drawImage(img,-cfg.drawW/2,-cfg.drawH/2,cfg.drawW,cfg.drawH);
  else{ctx.fillStyle=key==='jet'?'#d43b31':key==='jetski'?'#f2d238':'#6b7440';roundedRect(-cfg.drawW*.32,-cfg.drawH*.42,cfg.drawW*.64,cfg.drawH*.84,12);ctx.fill();}
  ctx.restore();
  if(key==='jet')drawJetEffects(now,cfg,arc,terrainX,terrainY,terrainRot,lift);

  if(state.mode==='levelExit'){
    // Derselbe Geschwindigkeitseffekt wie bei der Beere in „Flucht“.
    ctx.save();
    ctx.font='30px system-ui';
    ctx.textAlign='center';
    const puffY=state.jeepY+cfg.drawH*.58+10+Math.sin(now*.018)*4;
    ctx.fillText('💨',state.jeepX,puffY);
    ctx.restore();
  }
}
function tryJump(){if(state.mode!=='play'||state.jumping||state.fuel<JUMP_FUEL_COST)return;state.fuel=Math.max(0,state.fuel-JUMP_FUEL_COST);state.jumping=true;state.jumpElapsed=0;sfx('jump');updateHud();}

function drawOverlay(){
  if(state.mode==='start'){
    ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(W/2-190,H-94,380,52);ctx.textAlign='center';ctx.font='bold 24px system-ui';ctx.fillStyle='#f3d35c';ctx.fillText('Leertaste zum Start',W/2,H-60);ctx.textAlign='left';
  }else if(state.mode==='countdown'){
    ctx.fillStyle='rgba(5,10,8,.25)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 76px system-ui';ctx.fillStyle='#f3d35c';ctx.fillText(String(state.countdown),W/2,H/2+26);ctx.textAlign='left';
  }else if(state.mode==='paused'){
    ctx.fillStyle='rgba(5,10,8,.48)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 38px system-ui';ctx.fillStyle='#f3d35c';ctx.fillText('PAUSE',W/2,H/2);ctx.textAlign='left';
  }else if(['win','fuelFail','fail'].includes(state.mode)){
    const isWin=state.mode==='win',boxH=138,boxY=H-boxH-28;ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(W/2-330,boxY,660,boxH);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px system-ui';ctx.fillText(isWin?'ALLE 3 LEVEL GESCHAFFT!':state.mode==='fuelFail'?'TANK LEER!':'GECRASHED!',W/2,boxY+38);ctx.font='20px system-ui';ctx.fillStyle=isWin?'#f3d35c':'#ffaaaa';ctx.fillText(isWin?'Spiono hat die Rallye geschafft.':state.mode==='fuelFail'?(state.levelIndex===1?'Spiono säuft ohne Fuel ab.':state.levelIndex===2?'Spiono stürzt ohne Fuel ab.':'Spiono bleibt ohne Fuel liegen.'):'Spiono ist auf der Strecke geblieben.',W/2,boxY+74);ctx.font='16px system-ui';ctx.fillStyle='#ddd';ctx.fillText('Leertaste für einen neuen Versuch',W/2,boxY+108);ctx.textAlign='left';
  }
}
function draw(now){
  if(state.mode==='start'&&spriteReady(SPRITES.startScreen)){
    ctx.clearRect(0,0,W,H);ctx.drawImage(SPRITES.startScreen,0,0,W,H);drawOverlay();return;
  }
  if(state.mode==='win'&&spriteReady(SPRITES.winScreen)){
    ctx.clearRect(0,0,W,H);ctx.drawImage(SPRITES.winScreen,0,0,W,H);drawOverlay();return;
  }
  if(state.mode==='fail'||state.mode==='fuelFail'){
    const failImg=SPRITES.failScreens[state.levelIndex];
    if(spriteReady(failImg)){ctx.clearRect(0,0,W,H);ctx.drawImage(failImg,0,0,W,H);drawOverlay();return;}
  }
  ctx.save();if(state.shake>0){const m=6*(state.shake/.35);ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}drawGround();drawDustPatches(now);drawWindGustFx(now);drawStego();drawTriceratops();for(const c of state.creeks)drawCreek(c);for(const o of state.obstacles)drawObstacle(o);for(const b of state.wildboars)drawWildboar(b);for(const c of state.crocodiles)drawCrocodile(c);for(const k of state.kites)drawKite(k);for(const f of state.fuelItems)drawFuel(f);for(const m of state.medipacItems)drawMedipac(m);drawVehicle(now);ctx.restore();if(state.flash>0){ctx.fillStyle=`rgba(255,70,70,${Math.min(.28,state.flash)})`;ctx.fillRect(0,0,W,H);}drawNearMissFx(now);drawStegoMessage(now);drawTriceratopsMessage(now);drawOverlay();
}
function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt,now);draw(now);requestAnimationFrame(loop);}requestAnimationFrame(loop);

window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if(e.code==='Space'&&!e.repeat){if(state.mode==='play')tryJump();else if(state.mode==='start'||['win','fail','fuelFail'].includes(state.mode))startCountdown();}
  if(e.code==='KeyP'){if(state.mode==='play')state.mode='paused';else if(state.mode==='paused')state.mode='play';}
  if(e.code==='KeyM'&&!e.repeat){soundMuted=!soundMuted;if(audioCtx&&soundMuted)audioCtx.suspend();else if(audioCtx&&!soundMuted)audioCtx.resume();}
  if(e.code==='KeyF'&&!e.repeat&&['play','paused','countdown'].includes(state.mode)){state.fuel=FUEL_MAX;updateHud();}
  // TEST: 1/2/3 springt direkt zum jeweiligen Level, nicht in der Legende.
  if(!e.repeat&&['Digit1','Digit2','Digit3'].includes(e.code)){const idx=Number(e.code.slice(-1))-1;initLevel(idx,'play');}
});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;});
restartBtn.addEventListener('click',reset);
</script>
</body>
</html>
