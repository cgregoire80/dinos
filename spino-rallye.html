function shuffledCopy(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function spriteReady(img){return img&&img.complete&&img.naturalWidth>0;}
function fitByHeight(img,targetH,fallbackW=targetH){
  if(!spriteReady(img))return{w:fallbackW,h:targetH};
  return{w:targetH*(img.naturalWidth/img.naturalHeight),h:targetH};
}
function fuelDrawSize(){
  const img=SPRITES.fuels[state.levelIndex]||SPRITES.fuels[0];
  const scale=state.levelIndex===2?1.5:1;
  return fitByHeight(img,FUEL_H*scale,FUEL_W*scale);
}
function medipacDrawSize(){
  const img=SPRITES.medkits[state.levelIndex]||SPRITES.medkits[0];
  const scale=state.levelIndex===2?1.5:1;
  return fitByHeight(img,MEDIPAC_H*scale,MEDIPAC_W*scale);
}
function riverDrawH(){
  const img=SPRITES.river;
  return (spriteReady(img)?W*(img.naturalHeight/img.naturalWidth):RIVER_FALLBACK_H)*0.60;
}
function bridgeDrawSize(){
  const h=riverDrawH()*BRIDGE_HEIGHT_FACTOR;
  const img=SPRITES.bridge;
  const ratio=spriteReady(img)?img.naturalWidth/img.naturalHeight:1.095;
  return {w:h*ratio,h};
}

let audioCtx=null,soundMuted=false;
function ensureAudio(){
  if(soundMuted)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;
}
function tone(freq,duration=.09,type='sine',volume=.035,delay=0){
  const ac=ensureAudio();if(!ac)return;const t=ac.currentTime+delay,osc=ac.createOscillator(),gain=ac.createGain();
  volume*=SFX_VOLUME_MULTIPLIER;
  osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+duration+.03);
}
function sfx(name){
  if(soundMuted)return;
  if(name==='count')tone(500,.07,'square',.025);
  else if(name==='start'){tone(440,.07,'triangle',.03);tone(660,.10,'triangle',.035,.08)}
  else if(name==='hit'){tone(150,.12,'sawtooth',.045);tone(95,.18,'square',.035,.05)}
  else if(name==='fuel'){tone(620,.07,'triangle',.03);tone(840,.10,'triangle',.035,.07)}
  else if(name==='medipac'){tone(520,.07,'sine',.03);tone(700,.08,'sine',.035,.06);tone(920,.11,'triangle',.03,.13)}
  else if(name==='bonus'){tone(660,.07,'triangle',.035);tone(880,.09,'triangle',.04,.07);tone(1100,.13,'sine',.035,.15)}
  else if(name==='bomb'){tone(110,.16,'sawtooth',.050);tone(72,.24,'square',.036,.035)}
  else if(name==='jump'){tone(280,.07,'triangle',.03);tone(430,.09,'triangle',.035,.045);tone(620,.08,'sine',.025,.11)}
  else if(name==='level'){tone(520,.08,'triangle',.03);tone(700,.09,'triangle',.035,.08);tone(900,.12,'triangle',.04,.17)}
  else if(name==='fail'){tone(180,.14,'square',.04);tone(120,.20,'sawtooth',.035,.10)}
  else if(name==='win'){tone(440,.08,'triangle',.03);tone(660,.10,'triangle',.035,.09);tone(880,.15,'triangle',.04,.19)}
}

function makeFuelSchedule(count=FUEL_ITEMS_TOTAL){
  if(count===FUEL_ITEMS_TOTAL){
    return Array.from({length:count},(_,i)=>{
      const arrival=7.5+i*5+(Math.random()*1.5-.75);
      return {spawnAt:Math.max(.8,arrival-FUEL_TRAVEL_LEAD),spawned:false};
    });
  }
  // Bonus-Level: zwei zusätzliche Fuel-Items, über den ganzen Level verteilt.
  const firstArrival=5.8,lastArrival=46.0;
  return Array.from({length:count},(_,i)=>{
    const t=count<=1?0:i/(count-1);
    const arrival=firstArrival+(lastArrival-firstArrival)*t+(Math.random()*1.2-.6);
    return {spawnAt:Math.max(.8,arrival-FUEL_TRAVEL_LEAD),spawned:false};
  });
}

  return LEVELS[state.levelIndex].creekArrivals.map(arrival=>({spawnAt:Math.max(.5,arrival-FUEL_TRAVEL_LEAD),spawned:false}));

}

function makeWindGusts(){
  const gusts=[];
  let t=5.8+Math.random()*1.6;
  for(let i=0;i<5;i++){
    const dur=1.9+Math.random()*1.0;
    const force=(Math.random()<.5?-1:1)*(82+Math.random()*38)*1.20;
    gusts.push({start:t,dur,force});
    t+=6.2+Math.random()*2.5;
  }
  return gusts;
}
function makeDuckSchedule(){

function makeCrossingSchedule(count,start=6,end=48){
  const arr=[];
  const span=(end-start)/count;
  for(let i=0;i<count;i++){
    const center=start+span*(i+.5);
    const jitter=span*.26;
    arr.push({spawnAt:Math.max(1.2,center+(Math.random()*2-1)*jitter),spawned:false});
  }
  return arr;
}
function makeTimedSchedule(count,start=6,end=48,jitter=.22){
  const arr=[];
  const span=(end-start)/count;
  for(let i=0;i<count;i++){
    const center=start+span*(i+.5);
    arr.push({spawnAt:Math.max(1.2,center+(Math.random()*2-1)*(span*jitter)),spawned:false});
  }
  return arr;
}
function makeAmbientExplosionSchedule(count=BONUS_AMBIENT_EXPLOSION_COUNT,start=.8,end=49.2){
  // 100 rein optische Randexplosionen: zeitlich bewusst unregelmäßig,
  // aber gleichmäßig auf linke und rechte Seite verteilt.
  const sides=[];
  for(let i=0;i<count;i++)sides.push(i<count/2?'left':'right');
  for(let i=sides.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[sides[i],sides[j]]=[sides[j],sides[i]];}
  const times=[];
  for(let i=0;i<count;i++)times.push(start+Math.random()*(end-start));
  times.sort((a,b)=>a-b);
  return times.map((spawnAt,i)=>({spawnAt,spawned:false,side:sides[i]}));
}

function creekWaterHitRects(c){

function distanceBetweenRects(a,b){
  const dx=Math.max(0,Math.max(a.x-(b.x+b.w),b.x-(a.x+a.w)));
  const dy=Math.max(0,Math.max(a.y-(b.y+b.h),b.y-(a.y+a.h)));

function randomObstacleSpec(){

    return{type:'lavaRock',variant,hit:ROCK_HITBOXES[variant],drawSize:ROCK_DRAW_SIZE+10};
  }

    const type=Math.random()<.58?'cloud':'bird';
    const variant=Math.floor(Math.random()*3);
    if(type==='cloud')return{type,variant,hit:CLOUD_HITBOXES[variant],drawSize:CLOUD_DRAW_SIZES[variant]};
    return{type,variant,hit:BIRD_HITBOXES[variant],drawSize:BIRD_DRAW_SIZES[variant]};
  }
  if(state.levelIndex===1){
    const pool=[
      {type:'tree',variant:1,hit:TREE_HITBOXES[1],drawSize:TREE_DRAW_SIZE},
      {type:'rock',variant:1,hit:ROCK_HITBOXES[1],drawSize:ROCK_DRAW_SIZE},

      {type:'buoy',variant:1,hit:BUOY_HITBOXES[1],drawSize:BUOY_DRAW_SIZES[1]},
      {type:'buoy',variant:2,hit:BUOY_HITBOXES[2],drawSize:BUOY_DRAW_SIZES[2]}
    ];
    return pool[Math.floor(Math.random()*pool.length)];
  }

function spawnFuel(){

    const x=cfg.xMin+margin+Math.random()*Math.max(1,(cfg.xMax-cfg.xMin)-margin*2);
    const fs=fuelDrawSize(),r={x:x-fs.w*.40,y:y-fs.h*.42,w:fs.w*.80,h:fs.h*.84};
    if(overlapsAny(r,state.obstacles,obstacleRect,SPAWN_PAD_FUEL_OBSTACLE))continue;
    if(overlapsAny(r,state.medipacItems,medipacRect,SPAWN_PAD_FUEL_OBSTACLE))continue;

    candidates.push({x,score});

  if(!candidates.length)return false;candidates.sort((a,b)=>b.score-a.score);
  const pick=Math.random()<.72?candidates[0]:candidates[Math.floor(Math.random()*Math.min(3,candidates.length))];
  state.fuelItems.push({x:pick.x,y,w:FUEL_W,h:FUEL_H,spin:Math.random()*Math.PI*2});return true;
}

  if(state.levelIndex!==1||state.duck||bonusDuckCollected)return false;
  const cfg=levelCfg(),y=-74;
  for(let attempt=0;attempt<48;attempt++){
    const nearLeft=Math.random()<.5;
    const edgeOffset=42+Math.random()*24;
    const x=nearLeft?cfg.xMin+edgeOffset:cfg.xMax-edgeOffset;
    const inward=nearLeft?1:-1;
    const spec1=randomObstacleSpec(),spec2=randomObstacleSpec();
    const x1=x+inward*(70+spec1.hit.w/2);
    const y1=y+(Math.random()*2-1)*14;
    const x2=x+inward*(34+spec2.hit.w/2);
    const y2=y-(90+Math.random()*42);
    if(x1<cfg.xMin+spec1.hit.w/2||x1>cfg.xMax-spec1.hit.w/2)continue;
    if(x2<cfg.xMin+spec2.hit.w/2||x2>cfg.xMax-spec2.hit.w/2)continue;
    const duckCandidate={x:x-DUCK_HIT_W/2,y:y-DUCK_HIT_H/2,w:DUCK_HIT_W,h:DUCK_HIT_H};
    if(overlapsAny(duckCandidate,state.obstacles,obstacleRect,12))continue;
    if(!canPlaceObstacle(spec1,x1,y1,12)||!canPlaceObstacle(spec2,x2,y2,12))continue;
    pushObstacle(spec1,x1,y1,(Math.random()-.5)*.16);
    pushObstacle(spec2,x2,y2,(Math.random()-.5)*.16);
    state.duck={x,y,bob:Math.random()*Math.PI*2};
    return true;
  }
  return false;
}

function spawnBonusLavaBurst(){

  // Fontänen nur dort, wo im Hintergrund tatsächlich Lava zu sehen ist:
  // links ca. x=120..220, rechts entsprechend x=W-220..W-120.

    ? 120+Math.random()*100
    : W-220+Math.random()*100;

  const vx=(fromLeft?1:-1)*(300+Math.random()*55);
  state.lavaBursts.push({
    type:'lavaBurst',
    x:sourceX,
    y,
    sourceX,
    vx,
    fromLeft,
    age:0,

    rot:0,
    w:BONUS_LAVA_W,
    h:BONUS_LAVA_H,
    hitW:BONUS_LAVA_HIT_W,
    hitH:BONUS_LAVA_HIT_H,

}
function randomBonusBombTarget(){
  // Gleichmäßig verteilter Zufallspunkt im Kreis R=200 um (Bildmitte, y=300).
  const a=Math.random()*Math.PI*2;
  const r=Math.sqrt(Math.random())*BONUS_BOMB_TARGET_R;
  return {x:BONUS_BOMB_TARGET_CX+Math.cos(a)*r,y:BONUS_BOMB_TARGET_CY+Math.sin(a)*r};
}
function spawnBonusAmbientExplosion(item){
  if(state.levelIndex!==3)return false;
  const side=item.side==='right'?'right':'left';
  const x=side==='left'?(24+Math.random()*58):(W-24-Math.random()*58);
  // Explosion nicht dort platzieren, wo Greif gerade steht.
  let bestY=H/2,bestClear=-1;
  for(let attempt=0;attempt<36;attempt++){
    const y=72+Math.random()*(H-144);
    let clear=Infinity;
    for(const g of state.greifs)clear=Math.min(clear,Math.hypot(g.x-x,g.y-y));
    if(state.greifs.length===0)clear=Infinity;
    if(clear>bestClear){bestClear=clear;bestY=y;}
    if(clear>=155){bestY=y;break;}
  }
  state.explosions.push({x,y:bestY,age:0,dur:.42,harmless:true,ambient:true});
  sfx('bomb');
  return true;
}
function spawnGreifThrow(){
  if(state.levelIndex!==3)return false;
  const fromLeft=Math.random()<.5;
  // Weiter außen am Bildrand. Vertikal ist Greif Teil der scrollenden Welt und kommt von oben herein.
  const x=fromLeft?42:W-42;
  const y=-GREIF_DRAW_H*.42-Math.random()*18;
  const taunt=state.greifTaunts.length?state.greifTaunts.shift():'';
  state.greifs.push({x,y,fromLeft,age:0,bombReleased:false,done:false,taunt});
  return true;
}
function isWildboarYBlocked(y){
  const creekBlocked=state.creeks.some(c=>Math.abs(y-c.y)<riverDrawH()*.55+22);
  const obstacleBlocked=state.obstacles.some(o=>Math.abs(y-(o.y+(o.floatY||0)))<Math.max(o.hitH||0,WILDBOAR_H)*.60+18);
  return creekBlocked||obstacleBlocked;
}
function chooseWildboarY(baseY){
  const candidates=[baseY,...WILDBOAR_LANES].filter((v,i,a)=>a.indexOf(v)===i);
  const sorted=candidates.sort((a,b)=>Math.abs(a-baseY)-Math.abs(b-baseY));
  for(const y of sorted){ if(!isWildboarYBlocked(y)) return y; }
  return baseY;
}

function spawnWildboar(item){
  const fromLeft=!!item.fromLeft;
  const x=fromLeft?-WILDBOAR_W*.55:W+WILDBOAR_W*.55;
  const speed=(290+Math.random()*40)*1.10;
  const y=chooseWildboarY(item.y);
  state.wildboars.push({x,y,vx:(fromLeft?1:-1)*speed,fromLeft,phase:Math.random()*Math.PI*2});
  return true;
}
function spawnCrocodile(scheduleItem=null){
  const fromLeft=Math.random()<.5;
  const x=fromLeft?CROCODILE_BANK_X:W-CROCODILE_BANK_X;
  const targetX=fromLeft?W-CROCODILE_BANK_X:CROCODILE_BANK_X;
  const y=-CROCODILE_H*.62;
  const lower=!!(scheduleItem&&scheduleItem.lowerCrossing);
  const startSwimY=lower?(H*.62+Math.random()*H*.15):(112+Math.random()*155);
  const vx=(fromLeft?1:-1)*(138+Math.random()*38)*1.10;
  state.crocodiles.push({x,y,targetX,startSwimY,vx,fromLeft,movePhase:'waiting',phase:Math.random()*Math.PI*2,lower});
  return true;
}
function spawnKite(){
  const fromLeft=Math.random()<.5;
  const x=fromLeft?46:W-46;
  const y=H-38;
  const targetX=fromLeft?(W*(.74+Math.random()*.16)):(W*(.10+Math.random()*.16));
  const targetY=-110;
  const flyTime=(3.4+Math.random()*.7)/1.10;
  const vx=(targetX-x)/flyTime,vy=(targetY-y)/flyTime;
  state.kites.push({x,y,vx,vy,wait:2.0,fromLeft,phase:Math.random()*Math.PI*2,rot:fromLeft?.22:-.22});
  return true;
}
function spawnCreek(){
  const riverH=riverDrawH(),bridge=bridgeDrawSize();
  const y=-riverH/2-8,candidate={x:0,y:y-riverH/2,w:W,h:riverH};
  if(overlapsAny(candidate,state.obstacles,obstacleRect,SPAWN_PAD_CREEK_OBSTACLE))return false;
  if(overlapsAny(candidate,state.fuelItems,fuelRect,SPAWN_PAD_FUEL_CREEK))return false;
  if(overlapsAny(candidate,state.medipacItems,medipacRect,SPAWN_PAD_FUEL_CREEK))return false;
  const margin=bridge.w/2+28,bridgeX=170+margin+Math.random()*Math.max(1,580-margin*2);
  state.creeks.push({y,bridgeX,hit:false});return true;
}

function hitPlayer(){
  if(testNoCollisions||state.invuln>0)return;
  state.hits++;state.invuln=1;state.flash=.25;state.shake=.35;sfx('hit');
  if(state.hits>=MAX_HITS){state.mode='fail';sfx('fail');}
}

function update(dt,now){
  if(state.mode==='levelExit'){
    // Die komplette Szene bleibt stehen. Nur Spiono schießt aus dem Bild.
    state.jeepY-=state.exitSpeed*dt;
    state.exitSpeed=Math.min(980,state.exitSpeed+420*dt);
    const cfg=vehicleCfg();
    if(state.jeepY+cfg.drawH/2<-24){
      if(state.exitFinal==='main'){
        state.mode='win';
        sfx('win');
      }else if(state.exitFinal==='bonus'){
        state.mode='bonusWin';
        sfx('win');
      }else{
        startInterLevelCountdown(state.levelIndex+1);
      }
    }
    return;
  }
  if(state.mode==='countdown'){
    if(now>=state.countdownUntil){if(state.countdown>1){state.countdown--;state.countdownUntil=now+650;sfx('count');}else{state.mode='play';state.countdown=0;sfx('start');}}return;
  }
  if(state.mode!=='play')return;

  state.elapsed+=dt;state.fuel=Math.max(0,state.fuel-FUEL_DRAIN_PER_SECOND*dt);
  if(state.fuel<=0&&state.elapsed<LEVEL_SECONDS){state.fuel=0;state.mode='fuelFail';sfx('fail');updateHud();return;}
  if(state.elapsed>=LEVEL_SECONDS){state.elapsed=LEVEL_SECONDS;beginLevelExit();updateHud();return;}

  const cfg=levelCfg(),p=progress01(),speed=cfg.baseScroll*lerp(1,cfg.endSpeed,p);
  state.roadOffset=(state.roadOffset+speed*dt)%120;state.distanceTravelled+=speed*dt;
  if(state.distanceTravelled>=state.spawnDistance&&spawnObstaclePattern()){
    const gapFactor=state.levelIndex===3?1.125:.90;
    const gapMin=lerp(cfg.gapStart[0],cfg.gapEnd[0],p)*gapFactor,gapMax=lerp(cfg.gapStart[1],cfg.gapEnd[1],p)*gapFactor;
    state.spawnDistance+=gapMin+Math.random()*(gapMax-gapMin);
  }
  for(const f of state.fuelSchedule)if(!f.spawned&&state.elapsed>=f.spawnAt&&spawnFuel())f.spawned=true;
  if(state.medipacSchedule&&!state.medipacSchedule.spawned&&state.elapsed>=state.medipacSchedule.spawnAt&&spawnMedipac())state.medipacSchedule.spawned=true;
  if(state.levelIndex===0){
    for(const c of state.creekSchedule)if(!c.spawned&&state.elapsed>=c.spawnAt&&spawnCreek())c.spawned=true;
    for(const b of state.wildboarSchedule)if(!b.spawned&&state.elapsed>=b.spawnAt&&spawnWildboar(b))b.spawned=true;
  }
  if(state.levelIndex===1){
    for(const c of state.crocSchedule)if(!c.spawned&&state.elapsed>=c.spawnAt&&spawnCrocodile(c))c.spawned=true;
    if(state.duckSchedule&&!state.duckSchedule.spawned&&state.elapsed>=state.duckSchedule.spawnAt&&state.elapsed<=LEVEL_SECONDS*.90&&spawnDuck())state.duckSchedule.spawned=true;
  }
  if(state.levelIndex===2)for(const k of state.kiteSchedule)if(!k.spawned&&state.elapsed>=k.spawnAt&&spawnKite())k.spawned=true;
  if(state.levelIndex===3){
    for(const l of state.bonusLavaSchedule)if(!l.spawned&&state.elapsed>=l.spawnAt&&spawnBonusLavaBurst())l.spawned=true;
    for(const g of state.greifBombSchedule)if(!g.spawned&&state.elapsed>=g.spawnAt&&spawnGreifThrow())g.spawned=true;
    for(const ex of state.bonusAmbientExplosionSchedule)if(!ex.spawned&&state.elapsed>=ex.spawnAt&&spawnBonusAmbientExplosion(ex))ex.spawned=true;
  }
  if(state.levelIndex===0&&!state.stegoSpawned&&state.elapsed>=18){
    state.stego={x:92,y:-150,w:220,h:162,passed:false};
    state.stegoSpawned=true;
  }
  if(state.levelIndex===1&&!state.triceratopsSpawned&&state.elapsed>=18){
    state.triceratops={x:W-46,y:-165,w:228,h:185,passed:false};
    state.triceratopsSpawned=true;
  }

  const dirX=(keys.left?-1:0)+(keys.right?1:0),dirY=(keys.up?-1:0)+(keys.down?1:0);
  const lag=cfg.steerLag||0;
  state.steerX=state.steerX*lag + dirX*(1-lag);
  if(Math.abs(state.steerX)<0.001) state.steerX=0;
  let controlFactor=1,envPushX=0;
  const v=vehicleCfg();
  const playerProbe={x:state.jeepX-v.hitW*.5,y:state.jeepY-v.hitH*.5,w:v.hitW,h:v.hitH};
  if(state.levelIndex===2){
    const gust=state.windGusts.find(g=>state.elapsed>=g.start&&state.elapsed<g.start+g.dur);
    state.windForce=gust?gust.force:0;
    envPushX+=state.windForce;
  }
  const nextX=state.jeepX+state.steerX*cfg.moveX*dt*controlFactor+envPushX*dt,nextY=state.jeepY+dirY*cfg.moveY*dt;
  const minX=cfg.xMin,maxX=cfg.xMax,hitSide=(nextX<=minX||nextX>=maxX);
  state.jeepX=Math.max(minX,Math.min(maxX,nextX));
  state.jeepY=Math.max(v.hitH/2,Math.min(H-v.hitH/2,nextY));
  if(cfg.edgeHit && hitSide){if(!state.sideEdgeContact)hitPlayer();state.sideEdgeContact=true;}else state.sideEdgeContact=false;

  const targetTilt=state.steerX*.14;state.jeepTilt+=(targetTilt-state.jeepTilt)*Math.min(1,dt*10);
  if(state.jumping){state.jumpElapsed+=dt;if(state.jumpElapsed>=JUMP_DURATION){state.jumping=false;state.jumpElapsed=0;}}

  for(const o of state.obstacles){
    o.y+=speed*dt;
    if(o.type==='cloud')o.x=o.baseX+Math.sin(state.elapsed*.45+o.animPhase)*18;
    else if(o.type==='bird'){o.x=o.baseX+Math.sin(state.elapsed*2.10+o.animPhase)*24;o.rot=o.baseRot+Math.sin(state.elapsed*5.4+o.animPhase)*.06;}
    else if(o.type==='buoy'){o.rot=o.baseRot+Math.sin(state.elapsed*1.80+o.animPhase)*.10;o.floatY=Math.sin(state.elapsed*2.35+o.animPhase)*4.5;}
  }
  for(const f of state.fuelItems){f.y+=speed*dt;f.spin+=dt*1.7;}
  for(const m of state.medipacItems){m.y+=speed*dt;m.bob+=dt*1.9;}
  if(state.duck){state.duck.y+=speed*dt;state.duck.bob+=dt*2.4;if(state.duck.y>H+90)state.duck=null;}
  for(const c of state.creeks)c.y+=speed*dt;
  for(const pch of state.dustPatches)pch.y+=speed*dt;
  for(const b of state.wildboars){b.x+=b.vx*dt;}
  for(const c of state.crocodiles){
    if(c.movePhase==='waiting'){
      c.y+=speed*dt;
      if(c.y>=c.startSwimY)c.movePhase='swimming';
    }else if(c.movePhase==='swimming'){
      c.x+=c.vx*dt;
      if((c.fromLeft&&c.x>=c.targetX)||(!c.fromLeft&&c.x<=c.targetX)){
        c.x=c.targetX;
        c.movePhase='done';
      }
    }else{
      c.y+=speed*dt;
    }
  }
  for(const k of state.kites){
    if(k.wait>0){k.wait=Math.max(0,k.wait-dt);k.y+=Math.sin(state.elapsed*4+k.phase)*10*dt;}
    else{
      k.x+=k.vx*dt;
      k.y+=k.vy*dt;
      k.rot=Math.atan2(k.vx,-k.vy)*.42;
    }
  }
  for(const l of state.lavaBursts){
    l.age=(l.age||0)+dt;
    l.y+=speed*dt;
    l.x+=l.vx*dt;
    l.rot=(l.fromLeft?.10:-.10)+Math.sin(state.elapsed*6+l.phase)*.03;
  }
  for(const g of state.greifs){
    g.age+=dt;
    g.y+=speed*dt;
    // 3-Frame-Wurfanimation: 1 = Ausholen, 2 = Arm oben, 3 = Bombe losgelassen.
    if(!g.bombReleased&&g.age>=.82){
      g.bombReleased=true;
      if(g.taunt){state.greifMessage=g.taunt;state.greifMessageUntil=now+2800;}
      const target=randomBonusBombTarget();
      const throwX=g.x+(g.fromLeft?42:-42),throwY=g.y-58;
      const travel=.92+Math.random()*.22;
      state.bombs.push({
        startX:throwX,startY:throwY,x:throwX,y:throwY,
        targetX:target.x,targetY:target.y,
        age:0,travel,
        spin:(Math.random()<.5?-1:1)*(4.0+Math.random()*1.5),rot:0,
        exploded:false,sourceLeft:g.fromLeft
      });
    }
    if(g.age>=1.72)g.done=true;
  }
  for(const b of state.bombs){
    b.age+=dt;
    const t=Math.min(1,b.age/b.travel);
    b.x=lerp(b.startX,b.targetX,t);
    b.y=lerp(b.startY,b.targetY,t)-Math.sin(t*Math.PI)*72;
    b.rot+=b.spin*dt;
    if(t>=1&&!b.exploded){
      b.exploded=true;
      b.x=b.targetX;b.y=b.targetY;
      state.explosions.push({x:b.targetX,y:b.targetY,age:0,dur:.42,harmless:false});
      sfx('bomb');
      const dx=state.jeepX-b.targetX,dy=state.jeepY-b.targetY;
      if(Math.hypot(dx,dy)<=BONUS_BOMB_BLAST_R)hitPlayer();
    }
  }
  for(const ex of state.explosions)ex.age+=dt;
  if(state.stego){
    state.stego.y+=speed*dt;
    if(!state.stego.passed && state.stego.y>state.jeepY-10){
      state.stego.passed=true;
      state.stegoMessageUntil=now+2800;
    }
    if(state.stego.y>H+140)state.stego=null;
  }
  if(state.triceratops){
    state.triceratops.y+=speed*dt;
    if(!state.triceratops.passed && state.triceratops.y>state.jeepY-10){
      state.triceratops.passed=true;
      state.triceratopsMessageUntil=now+2800;
    }
    if(state.triceratops.y>H+160)state.triceratops=null;
  }
  state.obstacles=state.obstacles.filter(o=>o.y<H+120);
  state.fuelItems=state.fuelItems.filter(f=>f.y<H+100);
  state.medipacItems=state.medipacItems.filter(m=>m.y<H+100);
  state.creeks=state.creeks.filter(c=>c.y<H+100);
  state.dustPatches=state.dustPatches.filter(p=>p.y<H+120);
  state.crocodiles=state.crocodiles.filter(c=>c.y>-CROCODILE_H*1.5&&c.y<H+CROCODILE_H*1.5);
  state.kites=state.kites.filter(k=>k.x>-KITE_W&&k.x<W+KITE_W&&k.y>-KITE_H&&k.y<H+KITE_H+80);
  state.wildboars=state.wildboars.filter(b=>b.x>-WILDBOAR_W&&b.x<W+WILDBOAR_W&&b.y>-WILDBOAR_H&&b.y<H+WILDBOAR_H);
  state.lavaBursts=state.lavaBursts.filter(l=>l.y>-120&&l.y<H+120&&l.x>-180&&l.x<W+180);
  state.greifs=state.greifs.filter(g=>!g.done);
  state.bombs=state.bombs.filter(b=>!b.exploded);
  state.explosions=state.explosions.filter(ex=>ex.age<ex.dur);
  if(state.invuln>0)state.invuln=Math.max(0,state.invuln-dt);if(state.flash>0)state.flash=Math.max(0,state.flash-dt);if(state.shake>0)state.shake=Math.max(0,state.shake-dt);if(state.nearMissCooldown>0)state.nearMissCooldown=Math.max(0,state.nearMissCooldown-dt);

  const player={x:state.jeepX-v.hitW*.5,y:state.jeepY-v.hitH*.5,w:v.hitW,h:v.hitH};
  if(!state.jumping){
    for(const f of state.fuelItems){if(rectHit(player,fuelRect(f))){state.fuel=Math.min(FUEL_MAX,state.fuel+FUEL_PER_ITEM);state.fuelCollected++;f.y=H+200;sfx('fuel');}}
    for(const m of state.medipacItems){
      if(rectHit(player,medipacRect(m))){
        if(state.hits>0)state.hits--;
        m.y=H+200;
        sfx('medipac');
        updateHud();
      }
    }
    if(state.levelIndex===1&&state.duck&&rectHit(player,duckRect(state.duck))){
      bonusDuckCollected=true;
      state.duck=null;
      state.duckMessageUntil=0;
      sfx('bonus');
      updateHud();
    }
  }

  if(state.levelIndex===0&&state.invuln<=0&&!state.jumping){
    for(const c of state.creeks){
      if(c.hit)continue;
      const [left,right]=creekWaterHitRects(c);
      if(rectHit(player,left)||rectHit(player,right)){c.hit=true;hitPlayer();break;}
    }
  }
  if(state.invuln<=0&&!state.jumping){
    for(const o of state.obstacles){if(rectHit(player,obstacleRect(o))){o.y=H+200;hitPlayer();break;}}
    if(state.invuln<=0){for(const l of state.lavaBursts){if(rectHit(player,lavaBurstRect(l))){l.y=H+200;hitPlayer();break;}}}
    if(state.invuln<=0){for(const b of state.wildboars){if(rectHit(player,wildboarRect(b))){b.x=b.fromLeft?W+999:-999;hitPlayer();break;}}}
    if(state.invuln<=0){for(const c of state.crocodiles){if(!c.hit&&rectHit(player,crocodileRect(c))){c.hit=true;hitPlayer();break;}}}
    if(state.invuln<=0){for(const k of state.kites){if(rectHit(player,kiteRect(k))){k.y=-999;hitPlayer();break;}}}
  }
  if(state.mode==='play'&&state.invuln<=0&&state.nearMissCooldown<=0&&!state.jumping){
    let near=Math.min(nearestDistance(player,state.obstacles,obstacleRect),nearestDistance(player,state.lavaBursts,lavaBurstRect),nearestDistance(player,state.wildboars,wildboarRect),nearestDistance(player,state.crocodiles,crocodileRect),nearestDistance(player,state.kites,kiteRect));
    if(state.levelIndex===0&&!state.jumping){
      for(const c of state.creeks){
        const [left,right]=creekWaterHitRects(c);
        near=Math.min(near,distanceBetweenRects(player,left),distanceBetweenRects(player,right));
      }
    }
    if(near>0&&near<NEAR_MISS_DIST){state.nearMissUntil=now+230;state.nearMissCooldown=.45;}
  }
  updateHud();
}

function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawLand(){
  const bg=SPRITES.bgLand01;
  if(spriteReady(bg)){
    const scale=W/bg.naturalWidth;
    const drawW=W;
    const drawH=bg.naturalHeight*scale;
    // Exakt dieselbe Wegstrecke wie Items/Hindernisse: alles bewegt sich mit speed px/s nach unten.
    const scroll=((state.distanceTravelled%drawH)+drawH)%drawH;
    for(let y=scroll-drawH;y<H+drawH;y+=drawH){
      ctx.drawImage(bg,0,y,drawW,drawH);
    }
    return;

function drawJeepDirt(now,cfg,arc,terrainX,terrainY,terrainRot,lift){
  if(state.levelIndex!==0||state.mode!=='play'||arc>.08)return;

  ctx.save();

  ctx.rotate(state.jeepTilt+terrainRot);

  for(const side of [-1,1]){
    for(let i=0;i<9;i++){
      const phase=(t*2.05+i*.123+(side>0?.31:0))%1;
      const spread=10+phase*24;
      const x=side*(cfg.drawW*.34+spread)+Math.sin(t*9+i*2.3)*2.8;
      const y=rearY+9+phase*38;
      const r=4.9*(1-phase)+1.0;

      ctx.fillStyle=i%3===0?`rgba(116,76,39,${alpha})`:`rgba(151,101,53,${alpha})`;
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();

function drawJetskiSplash(now,cfg,arc,terrainX,terrainY,terrainRot,lift){
  if(state.levelIndex!==1||state.mode!=='play'||arc>.12)return;
  const t=now*.001;
  ctx.save();
  ctx.translate(state.jeepX+terrainX,state.jeepY-lift+terrainY);
  ctx.rotate(state.jeepTilt+terrainRot);
  const noseY=-cfg.drawH*.52;
  const rearY=cfg.drawH*.47;
  ctx.globalCompositeOperation='screen';

  // vordere Bug-Spritzer
  for(const side of [-1,1]){
    for(let i=0;i<8;i++){
      const phase=(t*2.45+i*.145+(side>0?.27:0))%1;
      const x=side*(7+phase*24)+Math.sin(t*7+i)*1.6;
      const y=noseY+phase*24;
      const rx=10.5*(1-phase)+1.8, ry=4.2*(1-phase)+1.0;
      ctx.fillStyle=`rgba(215,245,255,${0.38*(1-phase)})`;
      ctx.beginPath();
      ctx.ellipse(x,y,rx,ry,side*.42+phase*.22,0,Math.PI*2);
      ctx.fill();
    }
  }
  for(let i=0;i<8;i++){
    const phase=(t*2.00+i*.155)%1;
    const x=(Math.sin(t*6+i*1.3))*8;
    const y=noseY-4+phase*15;
    ctx.strokeStyle=`rgba(255,255,255,${0.46*(1-phase)})`;
    ctx.lineWidth=2.2*(1-phase)+.4;
    ctx.beginPath();
    ctx.moveTo(x-11,y+5);
    ctx.quadraticCurveTo(x,y-7,x+11,y+5);
    ctx.stroke();
  }

  // hintere Antriebs-/Wasserwirbel-Animation
  for(let i=0;i<13;i++){
    const phase=(t*2.85+i*.095)%1;
    const x=Math.sin(t*8+i*1.9)*9;
    const y=rearY+phase*42;
    const rx=8.8*(1-phase)+2.0;
    const ry=4.4*(1-phase)+1.1;
    ctx.fillStyle=`rgba(200,240,255,${0.36*(1-phase)})`;
    ctx.beginPath();
    ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    ctx.fill();
  }
  for(const side of [-1,1]){
    for(let i=0;i<6;i++){
      const phase=(t*2.05+i*.18+(side>0?.18:0))%1;
      const x=side*(7+phase*16);
      const y=rearY+4+phase*34;
      ctx.strokeStyle=`rgba(255,255,255,${0.40*(1-phase)})`;
      ctx.lineWidth=2.2*(1-phase)+.4;
      ctx.beginPath();
      ctx.arc(x,y,5+phase*10,Math.PI*(side<0?0.04:0.54),Math.PI*(side<0?1.22:1.72),side<0);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawJetEffects(now,cfg,arc,terrainX,terrainY,terrainRot,lift){

  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.30)';
  ctx.lineWidth=2.4;
  ctx.beginPath();

  ctx.moveTo(-24,noseY-8-spin*1.1);
  ctx.lineTo(24,noseY+8+spin*1.1);

function drawCenteredWrappedText(textValue,x,y,maxWidth,lineHeight){
  const words=textValue.split(/\s+/);let line='',lines=[];
  for(const word of words){
    const test=line?line+' '+word:word;
    if(line&&ctx.measureText(test).width>maxWidth){lines.push(line);line=word;}else line=test;
  }
  if(line)lines.push(line);
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],x,y+i*lineHeight);
  return lines.length;
}

window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=true;
  if(e.code==='Space'&&!e.repeat){
    if(state.mode==='play')tryJump();
    else if(state.mode==='bonusIntro')startBonusLevel();
    else if(['fail','fuelFail'].includes(state.mode) && state.levelIndex===3){initLevel(3,'countdown');ensureAudio();state.countdown=3;state.countdownUntil=performance.now()+650;sfx('count');}
    else if(state.mode==='start'||['fail','fuelFail'].includes(state.mode))startCountdown();
    // In den Winscreens hat die Leertaste bewusst keine Funktion.
  }
  if(e.code==='KeyP'){if(state.mode==='play')state.mode='paused';else if(state.mode==='paused')state.mode='play';}
  if(e.code==='KeyM'&&!e.repeat){soundMuted=!soundMuted;if(audioCtx&&soundMuted)audioCtx.suspend();else if(audioCtx&&!soundMuted)audioCtx.resume();}
  if(e.code==='KeyF'&&!e.repeat&&['play','paused','countdown'].includes(state.mode)){state.fuel=FUEL_MAX;updateHud();}
  // TEST: E = Quitscheentchen eingesammelt.
  if(e.code==='KeyE'&&!e.repeat){bonusDuckCollected=true;if(state.duck)state.duck=null;updateHud();}
  // TEST: O = Kollisionen an/aus.
  if(e.code==='KeyO'&&!e.repeat){testNoCollisions=!testNoCollisions;}
  // TEST: L gewinnt den aktuellen Level, nicht in der Legende.
  if(e.code==='KeyL'&&!e.repeat&&['play','paused'].includes(state.mode)){beginLevelExit();}
  // TEST: 1/2/3 springt direkt zum jeweiligen Level, 4 zum Bonus-Level.
  if(!e.repeat&&['Digit1','Digit2','Digit3','Digit4'].includes(e.code)){const idx=Number(e.code.slice(-1))-1;initLevel(idx,'play');}
});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;if(e.code==='ArrowDown'||e.code==='KeyS')keys.down=false;});
canvas.addEventListener('mousemove',e=>{
  if(state.mode==='win'&&bonusDuckCollected){
    const p=canvasPosFromEvent(e);
    canvas.style.cursor=pointInRect(p.x,p.y,BONUS_BADGE)?'pointer':'default';
  }else{
    canvas.style.cursor='default';
  }
});
canvas.addEventListener('mouseleave',()=>{canvas.style.cursor='default';});
canvas.addEventListener('click',e=>{
  if(state.mode==='win'&&bonusDuckCollected){
    const p=canvasPosFromEvent(e);
    if(pointInRect(p.x,p.y,BONUS_BADGE))openBonusPreview();
  }
});
restartBtn.addEventListener('click',()=>{canvas.style.cursor='default';reset();});
</script>
</body>
</html>
